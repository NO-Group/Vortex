# Vortex — Local Development Stack
# PostgreSQL + Redis + Vortex Server + Vortex Dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex -d vortex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/vortex-server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://vortex:vortex@postgres:5432/vortex
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=/data/storage
      - PUBLIC_API_BASE=auto
      - CORS_ORIGIN=*
    volumes:
      - vortex-storage:/data/storage
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/vortex-dashboard/Dockerfile
    environment:
      - VITE_API_BASE=http://localhost:4000/v1
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  vortex-storage:
