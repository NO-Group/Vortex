# Vortex platform stack — Postgres (+ optional Redis / MinIO) + the engine.
# The engine serves the console, the API, hosted apps, and functions on :8080.
#
#   cp .env.example .env   # set JWT_SECRET at minimum
#   docker compose up -d
#   open http://localhost:8080
#
# First admin:  npm run admin -- promote you@example.com   (from the repo root,
# or `docker compose exec vortex-server node -e` with DATABASE_URL set).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vortex
      MINIO_ROOT_PASSWORD: vortex-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: provision the default bucket in MinIO
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vortex vortex-secret &&
      mc mb --ignore-existing local/vortex
      "

  vortex-server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://vortex:vortex@postgres:5432/vortex
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    volumes:
      # Local storage driver persistence (uploads, hosted app files).
      - appdata:/workspace/.vortex-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
  miniodata:
  appdata:
