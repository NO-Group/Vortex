# Vortex platform stack — Postgres + Redis + engine.
# Storage uses Cloudflare R2 (zero egress fees) — no MinIO needed.
# The engine serves the console, the API, hosted apps, and functions on :8080.
#
#   cp .env.example .env   # set JWT_SECRET + R2 credentials
#   docker compose up -d
#   open http://localhost:8080
#
# First admin:  npm run admin -- promote you@example.com

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex}
      POSTGRES_DB: vortex
      # Tune Postgres for low-RAM: reduce shared buffers
      shared_buffers: 128MB
      max_connections: 50
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vortex-server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://vortex:${POSTGRES_PASSWORD:-vortex}@postgres:5432/vortex
      # Constrain Node.js heap to prevent unbounded memory growth
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "8080:8080"
    volumes:
      # Local storage driver persistence (uploads, hosted app files, fallback).
      - appdata:/workspace/.vortex-data
    mem_limit: 768m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
  appdata:
