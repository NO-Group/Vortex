[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vortex-cloud"
version = "1.0.0"
description = "Vortex BaaS Python SDK — auth, database, realtime, storage, functions, billing"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
