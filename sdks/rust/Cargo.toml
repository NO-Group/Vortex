[package]
name = "vortex-sdk"
version = "1.0.0"
edition = "2021"
description = "Vortex BaaS Rust SDK — auth, database, realtime, storage, functions, billing"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.23"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
